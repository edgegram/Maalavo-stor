<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Maalavo Store — Admin</title><link rel="stylesheet" href="css/admin.css"></head>
<body><div class="ambient"></div><main class="shell">
<section id="loginView" class="login-card"><div class="brand"><span class="brand-mark">M</span><span>MAALAVO STORE</span></div><p class="eyebrow">PRIVATE ADMIN</p><h1>Админ-панель</h1><p class="muted">Управление заказами, товарами и магазином.</p>
<form id="loginForm"><label>Логин<input id="username" autocomplete="username" required></label><label>Пароль<input id="password" type="password" autocomplete="current-password" required></label><button class="primary" type="submit">Войти</button></form><p id="loginError" class="error"></p></section>
<section id="appView" class="hidden"><header class="topbar"><div><p class="eyebrow">MAALAVO STORE</p><h1>Админ-панель</h1></div><div class="top-actions"><span id="adminName" class="pill"></span><button id="logout" class="ghost">Выйти</button></div></header>
<div id="toast" class="toast"></div><section class="stats"><article><span>Заказы</span><strong id="sOrders">—</strong></article><article><span>Новые</span><strong id="sNew">—</strong></article><article><span>Выполнено</span><strong id="sCompleted">—</strong></article><article><span>Пользователи</span><strong id="sUsers">—</strong></article><article><span>Выручка</span><strong id="sRevenue">—</strong></article></section>
<nav class="tabs"><button class="tab active" data-tab="orders">Заказы</button><button class="tab" data-tab="products">Товары</button></nav>
<section id="ordersTab" class="panel"><div class="panel-head"><div><h2>Заказы</h2><p class="muted">Последние 200 заказов.</p></div><button id="refreshOrders" class="ghost">Обновить</button></div><div id="ordersList" class="orders"></div></section>
<section id="productsTab" class="panel hidden"><div class="panel-head"><div><h2>Товары</h2><p class="muted">Ассортимент магазина.</p></div><button id="newProduct" class="primary small">+ Новый товар</button></div><div id="productsList" class="products"></div></section>
<section id="productEditor" class="modal hidden"><div class="modal-card"><div class="panel-head"><h2 id="editorTitle">Новый товар</h2><button id="closeEditor" class="icon-btn">×</button></div>
<form id="productForm"><label>ID товара<input id="pId" pattern="[a-z0-9][a-z0-9_-]{1,79}" required></label><label>Название<input id="pTitle" required maxlength="160"></label><label>Категория<input id="pCategory" required maxlength="80"></label><label>Описание<textarea id="pDescription" required maxlength="5000"></textarea></label><div class="grid2"><label>Цена от<input id="pPrice" type="number" min="0" step="0.01" required></label><label>Порядок<input id="pSort" type="number" min="0" step="1" value="0"></label></div><label>URL картинки<input id="pImage" maxlength="2048" placeholder="/assets/products/telegram-bot.png"></label><label class="check"><input id="pActive" type="checkbox" checked> Показывать в магазине</label><div class="form-actions"><button type="button" id="cancelEditor" class="ghost">Отмена</button><button class="primary" type="submit">Сохранить</button></div></form><p id="editorError" class="error"></p></div></section>
</section></main><script src="js/admin.js"></script></body></html>
