<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Maalavo Admin</title><link rel="stylesheet" href="css/admin.css"></head><body><div class="ambient"></div><main class="shell"><section id="loginView" class="login-card"><div class="brand"><span class="brand-mark">M</span>MAALAVO ADMIN</div><p class="eyebrow">PRIVATE PANEL</p><h1>Вход</h1><p class="muted">Управление товарами и заказами.</p><form id="loginForm"><label>Логин<input id="username" autocomplete="username" required></label><label>Пароль<input id="password" type="password" autocomplete="current-password" required></label><div id="loginError" class="error"></div><button class="primary">Войти</button></form></section><section id="appView" class="hidden"><header class="topbar"><div><p class="eyebrow">MAALAVO STORE</p><h1>Админ-панель</h1></div><div class="top-actions"><span id="adminName" class="pill">admin</span><button id="logout" class="ghost">Выйти</button></div></header><section class="stats"><article><span>Заказы</span><strong id="sOrders">0</strong></article><article><span>Новые</span><strong id="sNew">0</strong></article><article><span>Выполнено</span><strong id="sCompleted">0</strong></article><article><span>Пользователи</span><strong id="sUsers">0</strong></article><article><span>Оборот</span><strong id="sRevenue">0 ₽</strong></article></section><nav class="tabs"><button class="tab active" data-tab="orders">Заказы</button><button class="tab" data-tab="products">Товары</button></nav><section id="ordersTab" class="panel"><div class="panel-head"><h2>Заказы</h2><button id="refreshOrders" class="ghost">Обновить</button></div><div id="ordersList" class="orders"></div></section><section id="productsTab" class="panel hidden"><div class="panel-head"><h2>Товары</h2><button id="newProduct" class="primary small">Добавить товар</button></div><div id="productsList" class="products"></div></section></section></main><div id="productEditor" class="modal hidden"><div class="modal-card"><div class="panel-head"><h2 id="editorTitle">Новый товар</h2><button id="closeEditor" class="icon-btn">×</button></div><form id="productForm"><div class="grid2"><label>ID<input id="pId" required></label><label>Категория<input id="pCategory" required></label></div><label>Название<input id="pTitle" required></label><label>Описание<textarea id="pDescription" required></textarea></label><div class="grid2"><label>Цена от<input id="pPrice" type="number" min="0" required></label><label>Порядок<input id="pSort" type="number" min="0" value="0"></label></div><label>URL картинки<input id="pImage" type="url"></label><label class="check"><input id="pActive" type="checkbox" checked> Показывать товар</label><div id="editorError" class="error"></div><div class="form-actions"><button type="button" id="cancelEditor" class="ghost">Отмена</button><button class="primary">Сохранить</button></div></form></div></div><div id="toast" class="toast"></div><script src="js/admin.js"></script></body></html>
