<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MAALAVO — Control Room</title><style>
:root{--bg:#050507;--card:#0e0b16;--line:#38205d;--violet:#9a5cff;--text:#f3effa;--muted:#a79db6}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#21103e,#08060d 45%,#050507);color:var(--text);font:14px/1.45 system-ui,Segoe UI,sans-serif}
button,input,textarea,select{font:inherit}button{cursor:pointer}.wrap{max-width:1180px;margin:auto;padding:26px 18px 60px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px;flex-wrap:wrap;gap:10px}
.brand{font-weight:900;letter-spacing:2px;font-size:12px;color:#b98cff}
h1{margin:4px 0 0}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.stat,.panel{background:linear-gradient(145deg,#130d1d,#09070d);border:1px solid var(--line);border-radius:18px}
.stat{padding:16px}.stat small{color:var(--muted)}.stat b{display:block;font-size:25px;margin-top:6px}
.tabs{display:flex;gap:8px;overflow:auto;margin:18px 0}.tabs button{white-space:nowrap;background:#0d0a12;color:#bdb2cc;border:1px solid #322043;border-radius:12px;padding:9px 14px}
.tabs button.active{background:#25103e;color:#fff;border-color:#8246d5}
.panel{padding:18px;margin-bottom:14px}.panel h2{margin:0 0 14px;font-size:17px}
.form{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.field{display:flex;flex-direction:column;gap:5px}.field.full{grid-column:1/-1}
.field label{color:var(--muted);font-size:12px}.field input,.field textarea,.field select{background:#09070d;color:#fff;border:1px solid #352248;border-radius:11px;padding:10px;outline:none}
.field textarea{min-height:80px;resize:vertical}
.btn{border:1px solid #5b2c95;background:#1d0d30;color:#fff;border-radius:11px;padding:9px 14px}.btn.primary{background:#7a3bd0;border-color:#a56cff}.btn.danger{border-color:#70243b;color:#ff9ab0}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid #24182f}.row:first-child{border-top:0}
.row .meta{color:var(--muted);font-size:12px}.thumb{width:46px;height:46px;border-radius:10px;object-fit:cover;background:#1a0f2b;flex:0 0 auto}
.login{max-width:420px;margin:14vh auto}.hidden{display:none!important}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#180c26;border:1px solid #713bc0;padding:10px 16px;border-radius:12px;display:none;z-index:9}.toast.show{display:block}
.modal{position:fixed;inset:0;z-index:8;background:rgba(0,0,0,.7);display:none;place-items:center;padding:16px}.modal.show{display:grid}
.mbox{width:100%;max-width:560px;max-height:90vh;overflow-y:auto;background:#0d0816;border:1px solid var(--line);border-radius:20px;padding:20px}
.pill{padding:8px 12px;border:1px solid #4b2a77;border-radius:999px;color:#c9b8df;background:#130b21;font-size:12px}
@media(max-width:820px){.grid{grid-template-columns:repeat(2,1fr)}.form{grid-template-columns:1fr}}
</style></head><body>
<div id="login" class="wrap login"><div class="panel"><div class="brand">MAALAVO STORE</div><h1>Control Room</h1>
<p style="color:var(--muted)">Закрытая админ-панель.</p>
<div class="field"><label>Email администратора</label><input id="lEmail" type="email" autocomplete="username"></div>
<div class="field" style="margin-top:10px"><label>Пароль</label><input id="lPass" type="password" autocomplete="current-password"></div>
<div class="actions"><button class="btn primary" onclick="login()">Войти</button></div></div></div>

<div id="app" class="wrap hidden">
<div class="top"><div><div class="brand">MAALAVO STORE</div><h1>Control Room</h1></div>
<div style="display:flex;gap:8px;align-items:center"><span class="pill" id="pendingPill"></span><button class="btn" onclick="logout()">Выйти</button></div></div>
<div class="grid">
<div class="stat"><small>Пользователи</small><b id="sUsers">0</b></div>
<div class="stat"><small>Товары</small><b id="sProducts">0</b></div>
<div class="stat"><small>Заказы</small><b id="sOrders">0</b></div>
<div class="stat"><small>Ожидают</small><b id="sPending">0</b></div>
<div class="stat"><small>Выручка</small><b id="sRevenue">0 ₽</b></div></div>
<div class="tabs">
<button class="active" onclick="tab('products',this)">Товары</button>
<button onclick="tab('orders',this)">Заказы</button>
<button onclick="tab('users',this)">Пользователи</button>
<button onclick="tab('about',this)">О проекте</button></div>

<section id="products" class="tab">
<div class="panel"><h2>Новый товар</h2><div class="form">
<div class="field"><label>Название *</label><input id="pName"></div>
<div class="field"><label>Категория *</label><input id="pCat" list="catsD" placeholder="bots / apps / ..."><datalist id="catsD"><option>bots</option><option>apps</option><option>sites</option><option>plugins</option><option>avatars</option><option>accounts</option></datalist></div>
<div class="field"><label>Метка</label><input id="pTag" placeholder="БОТЫ"></div>
<div class="field"><label>Цена ₽ *</label><input id="pPrice" type="number" step="0.01" min="0"></div>
<div class="field"><label>Старая цена ₽ (скидка)</label><input id="pOld" type="number" step="0.01" min="0"></div>
<div class="field"><label>Наличие</label><input id="pStock" placeholder="в наличии / под заказ"></div>
<div class="field full"><label>Описание</label><textarea id="pDesc"></textarea></div>
<div class="field full"><label>Картинка — URL или загрузка</label><div style="display:flex;gap:8px"><input id="pImage" placeholder="/assets/products/bot.svg или /uploads/..." style="flex:1"><input id="pFile" type="file" accept="image/*" style="padding:8px"></div></div>
</div><div class="actions"><button class="btn primary" onclick="addProduct()">+ Добавить товар</button></div></div>
<div class="panel"><h2>Каталог</h2><div id="productsList"></div></div></section>

<section id="orders" class="tab hidden"><div class="panel"><h2>Заказы</h2><div id="ordersList"></div></div></section>
<section id="users" class="tab hidden"><div class="panel"><h2>Пользователи</h2><div id="usersList"></div></div></section>

<section id="about" class="tab hidden"><div class="panel"><h2>О проекте</h2>
<div class="field"><label>Заголовок</label><input id="aboutTitle"></div>
<div class="field"><label>Текст</label><textarea id="aboutText"></textarea></div>
<div class="field"><label>Ссылка поддержки</label><input id="aboutUrl"></div>
<div class="actions"><button class="btn primary" onclick="saveAbout()">Сохранить</button></div></div></section>
</div>

<div id="modal" class="modal"><div class="mbox" id="mbox"></div></div>
<div id="toast" class="toast"></div>
<script src="admin.js"></script></body></html>
