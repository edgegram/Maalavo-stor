<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08070c">
<title>Maalavo Control</title>
<style>
:root{--bg:#08070c;--panel:#120d18;--panel2:#18101f;--line:#fff1;--text:#f8f2fb;--muted:#968c9f;--purple:#b64cff;--violet:#7140ff;--ok:#54e3a0;--bad:#ff7188;--warn:#ffd166}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(800px 500px at 90% 0,#321348 0,transparent 62%),radial-gradient(700px 500px at 0 100%,#21103b 0,transparent 60%),var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-user-select:none;user-select:none}button,input,textarea,select{font:inherit}button{border:0;color:inherit;cursor:pointer}input,textarea,select{outline:0;color:var(--text);-webkit-user-select:text;user-select:text}.app{min-height:100vh}.side{position:fixed;inset:0 auto 0 0;width:260px;padding:18px 14px;background:#09070de8;border-right:1px solid var(--line);backdrop-filter:blur(22px);z-index:20;display:flex;flex-direction:column}.brand{display:flex;align-items:center;gap:10px;background:none;padding:8px 10px;margin-bottom:18px;text-align:left}.logo{width:38px;height:38px;border-radius:12px;background:linear-gradient(145deg,#d25aff,#6837ff);box-shadow:0 0 30px #9b43ff44;position:relative}.logo:after{content:"";position:absolute;inset:9px;border:2px solid #fff;border-radius:8px}.brand b{display:block;font-size:17px}.brand small{display:block;color:#a58cab;font-size:9px;letter-spacing:.22em}.space{padding:12px;border:1px solid var(--line);border-radius:15px;background:#fff1;text-align:left;margin-bottom:20px}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 10px var(--ok);margin-right:8px}.space b{font-size:12px}.space small{display:block;color:var(--muted);margin:4px 0 0 15px}.label{font-size:9px;color:#9e76b0;letter-spacing:.2em;margin:8px 10px}.nav{display:grid;gap:5px}.nav button,.settings{display:flex;align-items:center;gap:10px;width:100%;padding:12px;border-radius:13px;background:none;text-align:left;color:#a9a0af;transition:.18s}.nav button:hover,.settings:hover{background:#fff1;color:#fff}.nav button.active{background:#b64cff12;box-shadow:inset 2px 0 var(--purple);color:#fff}.nav button i{width:20px;font-style:normal;text-align:center}.nav button em{margin-left:auto;font-style:normal;font-size:10px;color:#71677a}.grow{flex:1}.profile{display:flex;align-items:center;gap:9px;padding:10px;border:1px solid var(--line);border-radius:14px}.ava{width:30px;height:30px;border-radius:10px;background:#2c2134;display:grid;place-items:center;font-weight:800}.profile b{font-size:11px}.profile small{display:block;color:var(--muted);font-size:9px;margin-top:2px}.main{margin-left:260px;min-height:100vh}.top{height:82px;position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;padding:0 28px;border-bottom:1px solid var(--line);background:#08070ce8;backdrop-filter:blur(18px)}.topLeft{display:flex;align-items:center;gap:12px}.back,.menu,.topBtn,.account{border:1px solid var(--line);background:#fff1;border-radius:12px;height:40px}.back{display:none;width:40px}.back.show{display:grid;place-items:center}.menu{display:none;width:40px}.menu span{display:block;width:17px;height:2px;background:#fff;margin:3px auto;border-radius:2px}.crumb{font-size:9px;color:#9a879f;letter-spacing:.12em}.title{font-size:21px;font-weight:800;margin-top:4px}.topActions{display:flex;gap:8px}.topBtn{width:40px}.account{padding:0 12px}.content{max-width:1240px;margin:auto;padding:28px}.head{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:20px}.eyebrow{font-size:10px;letter-spacing:.2em;color:#a85bd4}.h1{font-size:38px;margin:7px 0}.sub{color:var(--muted);max-width:680px}.primary{padding:12px 16px;border-radius:13px;background:linear-gradient(135deg,var(--purple),var(--violet));box-shadow:0 12px 30px #7d40ff33;font-weight:800}.primary:active,.soft:active,.danger:active,.nav button:active{transform:scale(.98)}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{border:1px solid var(--line);background:linear-gradient(145deg,#fff1,#fff0);border-radius:20px;padding:20px;box-shadow:0 25px 80px #0003}.metric small{color:var(--muted)}.metric strong{display:block;font-size:29px;margin:14px 0 5px}.up{color:var(--ok);font-size:11px}.columns{display:grid;grid-template-columns:1.35fr .9fr;gap:14px;margin-top:14px}.rows{display:grid;gap:7px}.row{display:flex;align-items:center;justify-content:space-between;padding:13px;border:1px solid var(--line);border-radius:14px;background:#fff0}.row b{font-size:12px}.muted{color:var(--muted)}.status{padding:6px 9px;border-radius:999px;background:#fff1;font-size:10px}.ok{color:var(--ok)}.warn{color:var(--warn)}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.search,.select{border:1px solid var(--line);background:#fff1;border-radius:13px;padding:12px 14px}.search{flex:1;min-width:220px}.select{background:#17101f}.products{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.product{display:flex;flex-direction:column;gap:11px}.pic{height:145px;border-radius:16px;border:1px solid var(--line);display:grid;place-items:center;color:#927ca0;background:radial-gradient(circle at 30% 20%,#c14dff44,transparent 45%),#110c15}.product h3{margin:0}.product p{margin:0;color:var(--muted);font-size:12px;line-height:1.5}.price{font-size:22px;font-weight:900}.actions{display:flex;gap:7px}.soft{flex:1;padding:10px;border-radius:11px;background:#fff1;border:1px solid var(--line)}.danger{padding:10px;border-radius:11px;background:#ff476d12;color:#ff9aab;border:1px solid #ff476d22}.orders{display:grid;gap:9px}.order{display:grid;grid-template-columns:1.2fr 1fr auto;gap:15px;align-items:center}.modalBg{position:fixed;inset:0;background:#000a;backdrop-filter:blur(8px);display:none;place-items:center;padding:18px;z-index:50}.modalBg.open{display:grid}.modal{width:min(620px,100%);background:#120d18;border:1px solid #fff2;border-radius:22px;padding:22px;box-shadow:0 30px 100px #0009}.modalHead{display:flex;justify-content:space-between;align-items:center}.close{width:36px;height:36px;border-radius:11px;background:#fff1;border:1px solid var(--line)}.fields{display:grid;gap:11px;margin:18px 0}.field label{display:block;color:#aaa0af;font-size:11px;margin-bottom:6px}.field input,.field textarea{width:100%;border:1px solid var(--line);background:#0d0a11;border-radius:12px;padding:12px}.field textarea{min-height:110px;resize:vertical}.modalActions{display:flex;justify-content:flex-end;gap:8px}.toast{position:fixed;right:18px;bottom:18px;z-index:80;padding:13px 16px;border:1px solid #fff2;background:#17101ef5;border-radius:14px;box-shadow:0 20px 60px #0009;animation:in .2s ease}@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}@media(max-width:900px){.side{transform:translateX(-105%);transition:.22s}.side.open{transform:none}.main{margin-left:0}.menu{display:block}.grid{grid-template-columns:repeat(2,1fr)}.columns{grid-template-columns:1fr}.products{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.top{height:70px;padding:0 14px}.content{padding:18px 14px}.title{font-size:18px}.topActions .topBtn{display:none}.h1{font-size:31px}.head{align-items:start;flex-direction:column}.grid{grid-template-columns:1fr}.products{grid-template-columns:1fr}.order{grid-template-columns:1fr}.account{padding:0 9px}}
</style>
</head>
<body>
<aside class="side" id="side"><button class="brand" data-view="dashboard"><span class="logo"></span><span><b>maalavo</b><small>CONTROL</small></span></button><button class="space"><span class="dot"></span><b>Основной магазин</b><small>рабочее пространство</small></button><div class="label">РАЗДЕЛЫ</div><nav class="nav"><button class="active" data-view="dashboard"><i>◈</i>Обзор<em>01</em></button><button data-view="products"><i>▦</i>Товары<em id="count">0</em></button><button data-view="orders"><i>≡</i>Заказы<em>04</em></button><button data-view="customers"><i>◎</i>Покупатели<em>04</em></button><button data-view="reviews"><i>★</i>Отзывы<em>03</em></button></nav><div class="grow"></div><div class="label">СИСТЕМА</div><button class="settings" data-view="settings"><i>⚙</i>Настройки<em>06</em></button><div class="profile"><span class="ava">A</span><span><b>admin</b><small>администратор</small></span></div></aside>
<main class="main"><header class="top"><div class="topLeft"><button class="back" id="back">←</button><button class="menu" id="menu"><span></span><span></span><span></span></button><div><div class="crumb" id="crumb">MAALAVO / ОБЗОР</div><div class="title" id="title">Панель управления</div></div></div><div class="topActions"><button class="topBtn" id="refresh">↻</button><button class="topBtn" id="notice">◌</button><button class="account" id="account">A&nbsp; admin</button></div></header><section class="content" id="view"></section></main>
<div class="modalBg" id="modalBg"><div class="modal" id="modal"></div></div><div id="toast"></div>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];let page='dashboard',stack=[];let products=JSON.parse(localStorage.getItem('maalavo_products')||'null')||[{id:1,name:'Веб-приложение',price:3000,cat:'Разработка',desc:'Полноценное веб-приложение.'},{id:2,name:'Сайт под ключ',price:5000,cat:'Сайты',desc:'Сайт с адаптивом и настройкой.'},{id:3,name:'UI/UX редизайн',price:2500,cat:'Дизайн',desc:'Новый интерфейс продукта.'}];const save=()=>localStorage.setItem('maalavo_products',JSON.stringify(products));const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));const toast=t=>{const e=document.createElement('div');e.className='toast';e.textContent=t;$('#toast').append(e);setTimeout(()=>e.remove(),2300)};function head(n,s,a=''){return `<div class="head"><div><div class="eyebrow">MAALAVO / ${n.toUpperCase()}</div><div class="h1">${n}</div><div class="sub">${s}</div></div>${a}</div>`}function go(v,push=true){if(push&&v!==page)stack.push(page);page=v;$('#back').classList.toggle('show',v!=='dashboard');$$('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===v));({dashboard,products:productsPage,orders,customers,reviews,settings}[v]||dashboard)();if(innerWidth<901)$('#side').classList.remove('open')}function back(){go(stack.pop()||'dashboard',false)}function dashboard(){$('#crumb').textContent='MAALAVO / ОБЗОР';$('#title').textContent='Панель управления';$('#view').innerHTML=head('Всё под контролем','Управляй магазином, товарами и заказами в одном месте.')+`<div class="grid"><div class="card metric"><small>Выручка</small><strong>248 560 ₽</strong><span class="up">↗ 18.4% за месяц</span></div><div class="card metric"><small>Заказы</small><strong>184</strong><span class="up">+24 за месяц</span></div><div class="card metric"><small>Покупатели</small><strong>1 284</strong><span class="up">+8.7% за месяц</span></div><div class="card metric"><small>Средний чек</small><strong>3 420 ₽</strong><span class="up">+4.2% за месяц</span></div></div><div class="columns"><div class="card"><h3>Последние заказы</h3><div class="rows">${['#MMUFRSI0805H3J · Веб-приложение · 3 000 ₽','#MMUEK5PBCLN13Q · Сайт под ключ · 17 500 ₽','#MMU9K2A1P7D · Лендинг · 3 500 ₽'].map(x=>`<div class="row"><b>${x}</b><span class="status ok">В работе</span></div>`).join('')}</div></div><div class="card"><h3>Состояние</h3><div class="rows"><div class="row"><span>API</span><span class="status ok">Работает</span></div><div class="row"><span>База данных</span><span class="status ok">Подключена</span></div><div class="row"><span>Очередь</span><span class="status warn">3</span></div></div></div></div>`}function productsPage(){$('#crumb').textContent='MAALAVO / ТОВАРЫ';$('#title').textContent='Товары';$('#view').innerHTML=head('Товары','Добавляй, редактируй и удаляй позиции магазина',`<button class="primary" id="add">+ Добавить товар</button>`)+`<div class="toolbar"><input class="search" id="search" placeholder="Поиск товара..."><select class="select" id="filter"><option value="">Все категории</option><option>Разработка</option><option>Сайты</option><option>Дизайн</option></select></div><div class="products" id="list"></div>`;$('#add').onclick=()=>productModal();renderProducts();$('#search').oninput=renderProducts;$('#filter').onchange=renderProducts}function renderProducts(){const q=($('#search')?.value||'').toLowerCase(),f=$('#filter')?.value||'';const list=products.filter(p=>(!q||p.name.toLowerCase().includes(q))&&(!f||p.cat===f));$('#count').textContent=products.length;$('#list').innerHTML=list.map(p=>`<article class="card product"><div class="pic">${esc(p.cat)}</div><h3>${esc(p.name)}</h3><p>${esc(p.desc)}</p><div class="price">${p.price.toLocaleString('ru-RU')} ₽</div><div class="actions"><button class="soft" data-edit="${p.id}">Изменить</button><button class="danger" data-del="${p.id}">Удалить</button></div></article>`).join('')||'<div class="card">Товаров не найдено.</div>';$$('[data-edit]').forEach(b=>b.onclick=()=>productModal(+b.dataset.edit));$$('[data-del]').forEach(b=>b.onclick=()=>deleteModal(+b.dataset.del))}function productModal(id){const p=products.find(x=>x.id===id)||{name:'',price:'',cat:'Разработка',desc:''};open(`<div class="modalHead"><div><div class="eyebrow">ТОВАР</div><h2>${id?'Изменение товара':'Новый товар'}</h2></div><button class="close" data-close>×</button></div><div class="fields"><div class="field"><label>Название</label><input id="name" value="${esc(p.name)}"></div><div class="field"><label>Цена</label><input id="price" type="number" min="0" value="${p.price}"></div><div class="field"><label>Категория</label><input id="cat" value="${esc(p.cat)}"></div><div class="field"><label>Описание</label><textarea id="desc">${esc(p.desc)}</textarea></div></div><div class="modalActions"><button class="soft" data-close>Отмена</button><button class="primary" id="save">Сохранить</button></div>`);$('#save').onclick=()=>{const name=$('#name').value.trim(),price=Number($('#price').value),cat=$('#cat').value.trim()||'Без категории',desc=$('#desc').value.trim();if(!name||!Number.isFinite(price)||price<0){toast('Проверь название и цену');return}if(id)Object.assign(p,{name,price,cat,desc});else products.unshift({id:Date.now(),name,price,cat,desc});save();close();productsPage();toast(id?'Товар обновлён':'Товар добавлен')}}function deleteModal(id){const p=products.find(x=>x.id===id);open(`<div class="modalHead"><div><div class="eyebrow">УДАЛЕНИЕ</div><h2>Удалить товар?</h2></div><button class="close" data-close>×</button></div><p class="muted">«${esc(p.name)}» будет удалён из списка.</p><div class="modalActions"><button class="soft" data-close>Отмена</button><button class="danger" id="yes">Удалить</button></div>`);$('#yes').onclick=()=>{products=products.filter(x=>x.id!==id);save();close();productsPage();toast('Товар удалён')}}function orders(){$('#crumb').textContent='MAALAVO / ЗАКАЗЫ';$('#title').textContent='Заказы';$('#view').innerHTML=head('Заказы','Контролируй статусы, очередь и детали заказов')+`<div class="orders">${['#MMUFRSI0805H3J','#MMUEK5PBCLN13Q','#MMU9K2A1P7D','#MMU7Q2LP1AA'].map((x,i)=>`<div class="card order"><div><b>${x}</b><div class="muted">${i%2?'Сайт под ключ · 17 500 ₽':'Веб-приложение · 3 000 ₽'}</div></div><span class="status ${i===3?'warn':'ok'}">${i===3?'Ожидает':'В работе'}</span><button class="soft" onclick="toast('Карточка заказа открыта')">Открыть</button></div>`).join('')}</div>`}function simple(n,s,a){$('#crumb').textContent='MAALAVO / '+n.toUpperCase();$('#title').textContent=n;$('#view').innerHTML=head(n,s)+`<div class="card rows">${a.map(x=>`<div class="row"><b>${x}</b><span class="status ok">Активно</span></div>`).join('')}</div>`}function customers(){simple('Покупатели','Профили, Telegram и история покупок',['Дрлп · @jhhjoigg','Ррр · @hpp','Ттт · @tottt','Admin · @maalavo'])}function reviews(){simple('Отзывы','Отзывы покупателей и модерация',['★★★★★ · Веб-приложение','★★★★☆ · Сайт под ключ','★★★★★ · Лендинг'])}function settings(){$('#crumb').textContent='MAALAVO / НАСТРОЙКИ';$('#title').textContent='Настройки';$('#view').innerHTML=head('Настройки','Управление параметрами панели и магазина',`<button class="primary" onclick="toast('Настройки сохранены')">Сохранить</button>`)+`<div class="columns"><div class="card"><h3>Магазин</h3><div class="fields"><div class="field"><label>Название</label><input value="Maalavo Store"></div><div class="field"><label>Валюта</label><input value="RUB ₽" disabled></div></div></div><div class="card"><h3>Интерфейс</h3><div class="rows"><div class="row"><span>Анимации</span><button class="status ok" onclick="this.classList.toggle('warn');toast('Параметр изменён')">Вкл</button></div><div class="row"><span>Уведомления</span><button class="status ok" onclick="toast('Параметр изменён')">Вкл</button></div></div></div></div>`}function open(h){$('#modal').innerHTML=h;$('#modalBg').classList.add('open');$$('[data-close]').forEach(b=>b.onclick=close)}function close(){$('#modalBg').classList.remove('open');$('#modal').innerHTML=''}$('#menu').onclick=()=>$('#side').classList.toggle('open');$('#back').onclick=back;$('#modalBg').onclick=e=>{if(e.target===$('#modalBg'))close()};$('#refresh').onclick=()=>{go(page,false);toast('Данные обновлены')};$('#notice').onclick=()=>toast('Новых уведомлений нет');$('#account').onclick=()=>toast('Профиль администратора');document.addEventListener('click',e=>{const b=e.target.closest('[data-view]');if(b){e.preventDefault();go(b.dataset.view)}});go('dashboard',false);
</script></body></html>
