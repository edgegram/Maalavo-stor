<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Maalavo Control</title><style>:root{--bg:#08070c;--p:#120d18;--p2:#19111f;--l:#ffffff12;--t:#f8f2fb;--m:#968c9f;--a:#b64cff;--b:#7140ff;--ok:#54e3a0;--bad:#ff7188;--w:#ffd166}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(800px 500px at 90% 0,#321348,transparent 62%),radial-gradient(700px 500px at 0 100%,#21103b,transparent 60%),var(--bg);color:var(--t);font:14px Inter,system-ui,sans-serif}body{user-select:none}button,input,textarea{font:inherit}button{cursor:pointer;color:inherit;border:0}input,textarea{user-select:text;color:var(--t);background:#0d0a11;border:1px solid var(--l);border-radius:12px;padding:12px;outline:0}.side{position:fixed;inset:0 auto 0 0;width:245px;padding:18px 14px;background:#09070dea;border-right:1px solid var(--l);backdrop-filter:blur(20px);z-index:20;display:flex;flex-direction:column}.brand{display:flex;gap:10px;align-items:center;background:0;padding:8px;margin-bottom:20px;text-align:left}.logo{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,#d25aff,#6837ff);box-shadow:0 0 30px #9b43ff44}.brand b{display:block}.brand small{display:block;color:#a58cab;font-size:9px;letter-spacing:.2em}.nav{display:grid;gap:5px}.nav button,.settings{display:flex;gap:10px;width:100%;padding:12px;border-radius:12px;background:0;color:#aaa0af;text-align:left}.nav button.active,.nav button:hover,.settings:hover{background:#b64cff14;color:#fff}.nav em{margin-left:auto;color:#71677a;font-style:normal;font-size:10px}.grow{flex:1}.profile{display:flex;gap:9px;align-items:center;padding:10px;border:1px solid var(--l);border-radius:14px}.ava{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;background:#2c2134;font-weight:800}.profile small{display:block;color:var(--m);font-size:9px}.main{margin-left:245px;min-height:100vh}.top{height:78px;position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;padding:0 28px;background:#08070ceb;border-bottom:1px solid var(--l);backdrop-filter:blur(18px)}.topLeft{display:flex;align-items:center;gap:10px}.back,.menu,.topBtn,.account{height:40px;border:1px solid var(--l);background:#ffffff08;border-radius:11px}.back{display:none;width:40px}.back.show{display:grid;place-items:center}.menu{display:none;width:40px}.menu i{display:block;width:17px;height:2px;background:#fff;margin:3px auto}.crumb{font-size:9px;color:#9a879f;letter-spacing:.12em}.title{font-size:20px;font-weight:800;margin-top:3px}.topActions{display:flex;gap:7px}.topBtn{width:40px}.account{padding:0 12px}.content{max-width:1300px;margin:auto;padding:28px}.head{display:flex;justify-content:space-between;gap:20px;align-items:end;margin-bottom:18px}.eyebrow{font-size:9px;letter-spacing:.2em;color:#b968e4}.h1{font-size:36px;font-weight:850;margin:7px 0}.sub{color:var(--m)}.primary{padding:12px 15px;border-radius:12px;background:linear-gradient(135deg,var(--a),var(--b));font-weight:800}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.card{border:1px solid var(--l);background:#ffffff04;border-radius:18px;padding:18px;box-shadow:0 20px 60px #0003}.metric small{color:var(--m)}.metric strong{display:block;font-size:28px;margin:12px 0 4px}.ok{color:var(--ok)}.warn{color:var(--w)}.bad{color:var(--bad)}.cols{display:grid;grid-template-columns:1.35fr .9fr;gap:12px;margin-top:12px}.rows{display:grid;gap:7px}.row{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:12px;border:1px solid var(--l);border-radius:12px}.tag{padding:5px 8px;border-radius:999px;background:#fff1;font-size:10px}.toolbar{display:flex;gap:8px;margin-bottom:12px}.search{flex:1}.products{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.pic{height:135px;border-radius:14px;border:1px solid var(--l);display:grid;place-items:center;background:radial-gradient(circle at 30% 20%,#c14dff44,transparent 45%),#110c15;color:#b980c8}.product h3{margin:0}.product p{color:var(--m);min-height:34px}.price{font-size:21px;font-weight:850;margin:8px 0}.actions{display:flex;gap:6px}.soft,.danger{padding:10px;border-radius:10px;border:1px solid var(--l);background:#fff1}.soft{flex:1}.danger{color:#ff9aab;background:#ff476d12}.orders{display:grid;gap:8px}.order{display:grid;grid-template-columns:1.3fr 1fr auto;gap:12px;align-items:center}.login{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(circle at 50% 30%,#351347,#08070c 65%);z-index:100}.loginbox{width:min(410px,calc(100% - 28px));padding:26px;border:1px solid var(--l);border-radius:24px;background:#120d18ee;box-shadow:0 30px 100px #0008}.loginbox h1{margin:0 0 5px}.loginbox p{color:var(--m);font-size:12px}.fields{display:grid;gap:10px;margin:18px 0}.field label{display:block;color:#aaa0af;font-size:10px;margin-bottom:6px}.modalbg{position:fixed;inset:0;z-index:60;background:#000b;backdrop-filter:blur(8px);display:none;place-items:center;padding:16px}.modalbg.open{display:grid}.modal{width:min(600px,100%);max-height:90vh;overflow:auto;background:var(--p);border:1px solid var(--l);border-radius:20px;padding:20px}.modalhead{display:flex;justify-content:space-between;align-items:center}.close{width:36px;height:36px;border-radius:10px;background:#fff1}.toast{position:fixed;right:18px;bottom:18px;z-index:120;padding:13px 16px;border:1px solid var(--l);background:#17101ef5;border-radius:12px;box-shadow:0 20px 60px #0009}@media(max-width:900px){.side{transform:translateX(-105%);transition:.2s}.side.open{transform:none}.main{margin-left:0}.menu{display:block}.grid{grid-template-columns:repeat(2,1fr)}.cols{grid-template-columns:1fr}.products{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.top{padding:0 14px}.content{padding:18px 14px}.grid,.products{grid-template-columns:1fr}.order{grid-template-columns:1fr}.topActions .topBtn{display:none}.h1{font-size:30px}}</style></head><body><div id="login" class="login"><form id="loginForm" class="loginbox"><div class="eyebrow">MAALAVO CONTROL</div><h1>Вход администратора</h1><p>Доступ к реальным данным магазина.</p><div class="fields"><div class="field"><label>Логин</label><input id="lu" autocomplete="username" required></div><div class="field"><label>Пароль</label><input id="lp" type="password" autocomplete="current-password" required></div></div><button class="primary" style="width:100%">Войти</button></form></div><aside class="side" id="side"><button class="brand" data-view="dashboard"><span class="logo"></span><span><b>maalavo</b><small>CONTROL</small></span></button><nav class="nav"><button data-view="dashboard">◈ Обзор</button><button data-view="products">▦ Товары <em id="pc">0</em></button><button data-view="orders">≡ Заказы <em id="oc">0</em></button><button data-view="customers">◎ Покупатели</button><button data-view="reviews">★ Отзывы</button></nav><div class="grow"></div><button class="settings" data-view="settings">⚙ Настройки</button><div class="profile"><span class="ava">A</span><span><b id="adminName">admin</b><small>администратор</small></span></div></aside><main class="main"><header class="top"><div class="topLeft"><button class="back" id="back">←</button><button class="menu" id="menu"><i></i><i></i><i></i></button><div><div class="crumb" id="crumb">MAALAVO / ОБЗОР</div><div class="title" id="title">Панель управления</div></div></div><div class="topActions"><button class="topBtn" id="refresh">↻</button><button class="account" id="logout">Выйти</button></div></header><section class="content" id="view"></section></main><div class="modalbg" id="mb"><div class="modal" id="modal"></div></div><div id="toast"></div><script>
const API='https://maalavo-stor-production-6edd.up.railway.app';const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];let page='dashboard',stack=[],data={products:[],orders:[],users:[],reviews:[],stats:{}};const token=()=>sessionStorage.getItem('maalavo_admin_token');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));const money=n=>Number(n||0).toLocaleString('ru-RU')+' ₽';function toast(t){const e=document.createElement('div');e.className='toast';e.textContent=t;$('#toast').append(e);setTimeout(()=>e.remove(),2400)}async function api(path,opt={}){const r=await fetch(API+path,{...opt,headers:{'content-type':'application/json',...(opt.headers||{}),...(token()?{Authorization:'Bearer '+token()}: {})}});let j={};try{j=await r.json()}catch{}if(r.status===401){sessionStorage.removeItem('maalavo_admin_token');showLogin();throw new Error(j.error||'Сессия истекла')}if(!r.ok)throw new Error(j.error||'Ошибка сервера');return j}function showLogin(){$('#login').style.display='grid';$('#side').style.display='none';$('.main').style.display='none'}function showApp(){$('#login').style.display='none';$('#side').style.display='flex';$('.main').style.display='block'}$('#loginForm').onsubmit=async e=>{e.preventDefault();try{const j=await api('/api/admin/login',{method:'POST',body:JSON.stringify({username:$('#lu').value.trim(),password:$('#lp').value})});sessionStorage.setItem('maalavo_admin_token',j.token);$('#adminName').textContent=j.admin.username;showApp();go('dashboard',false)}catch(err){toast(err.message)}};function head(n,s,a=''){return `<div class="head"><div><div class="eyebrow">MAALAVO / ${n.toUpperCase()}</div><div class="h1">${n}</div><div class="sub">${s}</div></div>${a}</div>`}function go(v,push=true){if(push&&v!==page)stack.push(page);page=v;$('#back').classList.toggle('show',v!=='dashboard');$$('[data-view]').forEach(x=>x.classList.toggle('active',x.dataset.view===v));if(innerWidth<901)$('#side').classList.remove('open');({dashboard,products,orders,customers,reviews,settings}[v]||dashboard)()}function back(){go(stack.pop()||'dashboard',false)}async function dashboard(){const j=await api('/api/admin/stats');data.stats=j.stats;const o=await api('/api/admin/orders');data.orders=o.orders;$('#crumb').textContent='MAALAVO / ОБЗОР';$('#title').textContent='Панель управления';$('#view').innerHTML=head('Всё под контролем','Данные прямо из Railway / PostgreSQL')+`<div class="grid"><div class="card metric"><small>Выручка</small><strong>${money(data.stats.revenue)}</strong></div><div class="card metric"><small>Заказы</small><strong>${data.stats.orders}</strong></div><div class="card metric"><small>Покупатели</small><strong>${data.stats.users}</strong></div><div class="card metric"><small>Товары</small><strong>${data.stats.products}</strong></div></div><div class="cols"><div class="card"><h3>Последние заказы</h3><div class="rows">${data.orders.slice(0,6).map(orderRow).join('')||'<div class="row">Заказов пока нет</div>'}</div></div><div class="card"><h3>Система</h3><div class="rows"><div class="row"><span>API</span><span class="tag ok">ONLINE</span></div><div class="row"><span>PostgreSQL</span><span class="tag ok">CONNECTED</span></div><div class="row"><span>Отзывы</span><span class="tag">${data.stats.reviews||0}</span></div></div></div></div>`}function orderRow(o){return `<div class="row"><div><b>#${esc(o.publicId)}</b><div class="muted">${esc(o.name)} · ${money(o.totalFrom)}</div></div><button class="tag" data-status="${o.id}">${esc(o.statusLabel||o.status)}</button></div>`}async function products(){const j=await api('/api/admin/products');data.products=j.products;$('#crumb').textContent='MAALAVO / ТОВАРЫ';$('#title').textContent='Товары';$('#view').innerHTML=head('Товары','Изменения сразу пишутся в PostgreSQL',`<button class="primary" id="add">＋ Добавить</button>`)+`<div class="toolbar"><input class="search" id="q" placeholder="Поиск..."></div><div class="products" id="pl"></div>`;$('#add').onclick=()=>productModal();$('#q').oninput=renderProducts;renderProducts()}function renderProducts(){const q=($('#q')?.value||'').toLowerCase();const list=data.products.filter(p=>(p.title+' '+p.description).toLowerCase().includes(q));$('#pc').textContent=data.products.filter(p=>p.active).length;$('#pl').innerHTML=list.map(p=>`<article class="card product"><div class="pic">${p.imageUrl?`<img src="${esc(p.imageUrl)}" style="max-width:100%;max-height:100%;border-radius:12px">`:'◇'}</div><h3>${esc(p.title)}</h3><p>${esc(p.description)}</p><div class="price">${money(p.priceFrom)}</div><small class="muted">${p.active?'Активен':'Скрыт'} · ${esc(p.category)}</small><div class="actions"><button class="soft" data-edit="${esc(p.id)}">Изменить</button><button class="danger" data-del="${esc(p.id)}">Удалить</button></div></article>`).join('')||'<div class="card">Ничего не найдено</div>'}function productModal(id){const p=data.products.find(x=>x.id===id)||{id:'p-'+Date.now(),title:'',category:'services',description:'',priceFrom:'',imageUrl:'',sortOrder:0};$('#mb').classList.add('open');$('#modal').innerHTML=`<div class="modalhead"><div><div class="eyebrow">ТОВАР</div><h2>${id?'Изменение':'Новый товар'}</h2></div><button class="close" data-close>×</button></div><div class="fields"><div class="field"><label>Название</label><input id="pt" value="${esc(p.title)}"></div><div class="field"><label>Цена</label><input id="pp" type="number" min="0" value="${p.priceFrom}"></div><div class="field"><label>Категория</label><input id="pcat" value="${esc(p.category)}"></div><div class="field"><label>URL изображения</label><input id="pi" value="${esc(p.imageUrl||'')}"></div><div class="field"><label>Описание</label><textarea id="pd">${esc(p.description)}</textarea></div></div><div class="actions"><button class="soft" data-close>Отмена</button><button class="primary" id="save">Сохранить</button></div>`;$('#save').onclick=async()=>{const body={title:$('#pt').value.trim(),priceFrom:Number($('#pp').value),category:$('#pcat').value.trim(),imageUrl:$('#pi').value.trim(),description:$('#pd').value.trim()};if(!body.title||!body.description||!Number.isFinite(body.priceFrom)||body.priceFrom<0){toast('Проверь данные');return}try{if(id)await api('/api/admin/products/'+encodeURIComponent(id),{method:'PATCH',body:JSON.stringify(body)});else await api('/api/admin/products',{method:'POST',body:JSON.stringify({id:p.id,...body})});close();products();toast(id?'Товар обновлён':'Товар добавлен')}catch(e){toast(e.message)}}}async function deleteProduct(id){const p=data.products.find(x=>x.id===id);if(!p)return;openConfirm('Удалить товар?',`«${p.title}» будет скрыт из магазина.`,async()=>{try{await api('/api/admin/products/'+encodeURIComponent(id),{method:'DELETE'});close();products();toast('Товар удалён')}catch(e){toast(e.message)}})}function openConfirm(h,s,fn){$('#mb').classList.add('open');$('#modal').innerHTML=`<div class="modalhead"><h2>${h}</h2><button class="close" data-close>×</button></div><p class="muted">${esc(s)}</p><div class="actions"><button class="soft" data-close>Отмена</button><button class="danger" id="confirm">Удалить</button></div>`;$('#confirm').onclick=fn}async function orders(){const j=await api('/api/admin/orders');data.orders=j.orders;$('#oc').textContent=data.orders.length;$('#crumb').textContent='MAALAVO / ЗАКАЗЫ';$('#title').textContent='Заказы';$('#view').innerHTML=head('Заказы','Очередь и статусы синхронизированы с базой')+`<div class="orders">${data.orders.map(o=>`<div class="card order"><div><b>#${esc(o.publicId)}</b><div class="muted">${esc(o.name)} · ${esc(o.telegram)} · ${money(o.totalFrom)}</div><small class="muted">Очередь: ${o.queuePosition||'—'}</small></div><button class="tag" data-status="${o.id}">${esc(o.statusLabel||o.status)}</button><button class="soft" data-open="${o.id}">Детали</button></div>`).join('')||'<div class="card">Заказов пока нет</div>'}</div>`}function statusMenu(id){const o=data.orders.find(x=>x.id===id);const items=[['new','Новый'],['in_progress','В работе'],['paid','Оплачен'],['completed','Получен'],['cancelled','Отменён']];$('#mb').classList.add('open');$('#modal').innerHTML=`<div class="modalhead"><h2>Статус #${esc(o.publicId)}</h2><button class="close" data-close>×</button></div><div class="rows">${items.map(([v,n])=>`<button class="row" data-setstatus="${v}"><b>${n}</b><span>${o.status===v?'✓':''}</span></button>`).join('')}</div>`;$$('[data-setstatus]').forEach(b=>b.onclick=async()=>{try{await api('/api/admin/orders/'+encodeURIComponent(id),{method:'PATCH',body:JSON.stringify({status:b.dataset.setstatus})});close();orders();toast('Статус обновлён')}catch(e){toast(e.message)}})}async function customers(){const j=await api('/api/admin/users');data.users=j.users;$('#crumb').textContent='MAALAVO / ПОКУПАТЕЛИ';$('#title').textContent='Покупатели';$('#view').innerHTML=head('Покупатели','Реальные Telegram-профили из PostgreSQL')+`<div class="rows">${data.users.map(u=>`<div class="card row"><div><b>${esc(u.displayName||'Покупатель')}</b><div class="muted">@${esc(u.username||'нет username')} · TG ${esc(u.telegramId||'—')}</div></div><span class="tag">ID ${esc(u.accountNumber)}</span></div>`).join('')||'<div class="card">Покупателей пока нет</div>'}</div>`}async function reviews(){const j=await api('/api/admin/reviews');data.reviews=j.reviews;$('#crumb').textContent='MAALAVO / ОТЗЫВЫ';$('#title').textContent='Отзывы';$('#view').innerHTML=head('Отзывы','Отзывы доступны в базе только после получения заказа')+`<div class="rows">${data.reviews.map(r=>`<div class="card"><div><b>${'★'.repeat(r.rating)}${'☆'.repeat(5-r.rating)}</b> · ${esc(r.title)}</div><p>${esc(r.text||'Без текста')}</p><small class="muted">${esc(r.displayName||'Покупатель')} · заказ #${esc(r.orderId)}</small></div>`).join('')||'<div class="card">Отзывов пока нет</div>'}</div>`}function settings(){goSimple('Настройки','Системные параметры панели.')}function goSimple(n,s){$('#crumb').textContent='MAALAVO / '+n.toUpperCase();$('#title').textContent=n;$('#view').innerHTML=head(n,s)+`<div class="card"><p class="muted">Авторизация и данные магазина работают через Railway API.</p><button class="danger" id="logout2">Выйти из админки</button></div>`;$('#logout2').onclick=logout}function close(){$('#mb').classList.remove('open');$('#modal').innerHTML=''}function logout(){sessionStorage.removeItem('maalavo_admin_token');location.reload()}$('#menu').onclick=()=>$('#side').classList.toggle('open');$('#back').onclick=back;$('#refresh').onclick=()=>go(page,false);$('#logout').onclick=logout;$('#mb').onclick=e=>{if(e.target===$('#mb'))close()};document.addEventListener('click',e=>{const v=e.target.closest('[data-view]');if(v){e.preventDefault();go(v.dataset.view)}if(e.target.closest('[data-edit]'))productModal(e.target.closest('[data-edit]').dataset.edit);if(e.target.closest('[data-del]'))deleteProduct(e.target.closest('[data-del]').dataset.del);if(e.target.closest('[data-close]'))close();if(e.target.closest('[data-status]'))statusMenu(e.target.closest('[data-status]').dataset.status)});if(token()){showApp();go('dashboard',false)}else showLogin();</script></body></html>
