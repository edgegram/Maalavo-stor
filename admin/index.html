<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MAALAVO CONTROL ROOM</title><style>
:root{--bg:#050507;--card:#0e0b16;--line:#38205d;--violet:#9a5cff;--text:#f3effa;--muted:#a79db6;--danger:#ff557a;--ok:#65e6a5}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#21103e 0,#08060d 42%,#050507 75%);color:var(--text);font:14px/1.45 system-ui,-apple-system,Segoe UI,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}.wrap{max-width:1180px;margin:auto;padding:28px 18px 60px}.top{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:24px}.brand{font-weight:900;letter-spacing:2px}.pill{padding:8px 12px;border:1px solid #4b2a77;border-radius:999px;color:#c9b8df;background:#130b21}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat,.panel{background:linear-gradient(145deg,#130d1d,#09070d);border:1px solid var(--line);border-radius:20px;box-shadow:0 12px 40px #0007}.stat{padding:18px}.stat small{color:var(--muted)}.stat b{display:block;font-size:27px;margin-top:7px}.tabs{display:flex;gap:8px;overflow:auto;margin:20px 0}.tabs button{white-space:nowrap;background:#0d0a12;color:#bdb2cc;border:1px solid #322043;border-radius:12px;padding:10px 14px}.tabs button.active{background:#25103e;color:#fff;border-color:#8246d5}.panel{padding:18px;margin-bottom:14px}.panel h2{margin:0 0 14px}.form{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}.field label{color:var(--muted);font-size:12px}.field input,.field textarea,.field select{width:100%;background:#09070d;color:#fff;border:1px solid #352248;border-radius:12px;padding:11px;outline:none}.field textarea{min-height:100px;resize:vertical}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.btn{border:1px solid #5b2c95;background:#1d0d30;color:#fff;border-radius:12px;padding:10px 14px}.btn.primary{background:#7a3bd0;border-color:#a56cff}.btn.danger{border-color:#70243b;color:#ff9ab0}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 0;border-top:1px solid #24182f}.row:first-child{border-top:0}.row .meta{color:var(--muted);font-size:12px}.login{max-width:430px;margin:15vh auto}.hidden{display:none!important}.tag{color:#b98cff;font-size:11px;letter-spacing:1.5px}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#180c26;border:1px solid #713bc0;padding:10px 14px;border-radius:12px;display:none}.toast.show{display:block}@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}.form{grid-template-columns:1fr}}@media(max-width:480px){.grid{grid-template-columns:1fr 1fr}.wrap{padding:18px 12px 40px}}
</style></head><body><div id="login" class="wrap login"><div class="panel"><div class="tag">MAALAVO STORE</div><h1>Control Room</h1><p style="color:var(--muted)">Закрытая админ-панель. Доступ защищён сервером.</p><div class="field"><label>Пароль администратора</label><input id="password" type="password" autocomplete="current-password"></div><div class="actions"><button class="btn primary" onclick="login()">Войти</button></div></div></div>
<div id="app" class="wrap hidden"><div class="top"><div><div class="tag">MAALAVO STORE</div><h1 style="margin:3px 0 0">Control Room</h1></div><div class="pill">ADMIN · 8721768505</div></div><div class="grid"><div class="stat"><small>Пользователи</small><b id="sUsers">0</b></div><div class="stat"><small>Товары</small><b id="sProducts">0</b></div><div class="stat"><small>Заказы</small><b id="sOrders">0</b></div><div class="stat"><small>Выручка</small><b id="sRevenue">0 ₽</b></div></div><div class="tabs"><button class="active" data-tab="products" onclick="tab('products',this)">Товары</button><button data-tab="orders" onclick="tab('orders',this)">Заказы</button><button data-tab="users" onclick="tab('users',this)">Пользователи</button><button data-tab="about" onclick="tab('about',this)">О проекте</button></div><section id="products" class="tab"><div class="panel"><h2>Добавить товар</h2><div class="form"><div class="field"><label>Название</label><input id="pName"></div><div class="field"><label>Категория</label><select id="pCat"><option>bots</option><option>apps</option><option>sites</option><option>plugins</option><option>avatars</option><option>accounts</option></select></div><div class="field"><label>Цена ₽</label><input id="pPrice" type="number"></div><div class="field"><label>Метка</label><input id="pTag" placeholder="БОТЫ"></div><div class="field full"><label>Описание</label><textarea id="pDesc"></textarea></div><div class="field full"><label>Изображение URL</label><input id="pImage" placeholder="/assets/product.jpg"></div></div><div class="actions"><button class="btn primary" onclick="addProduct()">+ Добавить</button></div></div><div class="panel"><h2>Каталог</h2><div id="productsList"></div></div></section><section id="orders" class="tab hidden"><div class="panel"><h2>Заказы</h2><div id="ordersList"></div></div></section><section id="users" class="tab hidden"><div class="panel"><h2>Пользователи</h2><div id="usersList"></div></div></section><section id="about" class="tab hidden"><div class="panel"><h2>О проекте</h2><div class="field"><label>Заголовок</label><input id="aboutTitle"></div><div class="field" style="margin-top:10px"><label>Текст</label><textarea id="aboutText"></textarea></div><div class="actions"><button class="btn primary" onclick="saveAbout()">Сохранить</button></div></div></section></div><div id="toast" class="toast"></div><script src="admin.js"></script></body></html>
