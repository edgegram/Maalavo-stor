name: Fix frontend paths
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix V31 frontend paths
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('frontend/index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('frontend/css/', 'css/')
          s = s.replace('frontend/js/', 'js/')
          s = s.replace('frontend/assets/', 'assets/')
          p.write_text(s, encoding='utf-8')
          PY
          git rm -f .github/workflows/fix-frontend-paths.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/index.html
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Fix frontend asset paths for GitHub Pages'
          git push
