name: Split inline assets

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  split:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Split CSS and JS from public/index.html
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('public/index.html')
          html = path.read_text(encoding='utf-8')

          styles = re.findall(r'<style>(.*?)</style>', html, flags=re.S)
          scripts = re.findall(r'<script>(.*?)</script>', html, flags=re.S)

          if len(styles) != 1 or len(scripts) != 2:
              raise SystemExit(f'Expected 1 style block and 2 script blocks; got {len(styles)} and {len(scripts)}')

          Path('public/style.css').write_text(styles[0].lstrip('\n'), encoding='utf-8')
          Path('public/script.js').write_text('\n\n'.join(scripts).lstrip('\n'), encoding='utf-8')

          html = re.sub(r'<style>.*?</style>', '<link rel="stylesheet" href="style.css">', html, count=1, flags=re.S)
          html = re.sub(r'<script>.*?</script>', '<script src="script.js"></script>', html, count=1, flags=re.S)
          html = re.sub(r'<script>.*?</script>', '', html, count=1, flags=re.S)
          html = html.replace('<script src="script.js"></script>\n\n\n</body>', '<script src="script.js"></script>\n\n</body>')
          path.write_text(html, encoding='utf-8')

      - name: Commit split files and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/split-assets.yml
          git add public/index.html public/style.css public/script.js
          git diff --cached --quiet && exit 0
          git commit -m "Split site CSS and JS into public files"
          git push