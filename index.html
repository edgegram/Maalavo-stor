<script>
window.addEventListener("error", function(e) {
  document.body.innerHTML =
    '<pre style="white-space:pre-wrap;padding:20px;color:#ff6b6b;background:#050507;font:14px monospace">' +
    'JS ERROR\\n\\n' + (e.error?.stack || e.message || e.filename || 'Unknown error') +
    '</pre>';
});
window.addEventListener("unhandledrejection", function(e) {
  document.body.innerHTML =
    '<pre style="white-space:pre-wrap;padding:20px;color:#ff6b6b;background:#050507;font:14px monospace">' +
    'PROMISE ERROR\\n\\n' + (e.reason?.stack || e.reason || 'Unknown rejection') +
    '</pre>';
});
</script>
