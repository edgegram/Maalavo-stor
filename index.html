<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b090d">
<meta name="color-scheme" content="dark">
<title>Maalavo Store</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app"></div>
<script>
(async()=>{
  const root=document.getElementById('app');
  try{
    const r=await fetch('app-shell.html',{cache:'no-store'});
    if(!r.ok) throw new Error('Не удалось загрузить интерфейс');
    root.innerHTML=await r.text();
    const s=document.createElement('script');
    s.src='js/config.js';
    document.body.appendChild(s);
    s.onload=()=>{const a=document.createElement('script');a.src='js/app.js';a.defer=true;document.body.appendChild(a)};
  }catch(e){root.innerHTML='<main style="min-height:100vh;display:grid;place-items:center;background:#08060d;color:#fff;font-family:system-ui;padding:24px;text-align:center"><div><h1>Maalavo Store</h1><p>Не удалось загрузить интерфейс. Обновите страницу.</p></div></main>';console.error(e)}
})();
</script>
</body>
</html>
